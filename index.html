<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skaði</title>

  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <!-- CSS and Fonts -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
  <!-- PhotoSwipe 5 (self-hosted to avoid CORB on live server) -->
  <link rel="stylesheet" href="vendor/photoswipe/photoswipe.min.css" />
  <link rel="stylesheet" href="style.css" />

  <!-- Your existing CSS styles -->
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    header {
      background-color: #333;
      color: white;
      padding: 10px 20px; /* Adjusted padding */
      text-align: center;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 80px; /* Fixed height for the header */
      box-sizing: border-box; /* Include padding in the height */
    }

    header h1 {
      font-family: 'Bebas Neue', cursive;
      font-size: 48px;
      margin: 0;
      letter-spacing: 3px;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
      line-height: 1; /* Ensure the text height doesn't affect vertical alignment */
    }

    header {
      gap: 20px;
    }

    #download-csv {
      padding: 6px 12px;
      font-size: 14px;
      background: #45818e;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    #download-csv:hover {
      background: #5a9aa8;
    }

    #tabs {
      display: flex;
      background-color: #333;
      padding: 0;
      margin: 0;
      list-style: none;
    }

    #tabs li {
      flex: 1;
      text-align: center;
    }

    #tabs li a {
      display: block;
      padding: 10px;
      color: white;
      text-decoration: none;
      font-family: 'Bebas Neue', cursive;
      font-size: 24px;
      letter-spacing: 2px;
    }

    #tabs li a.active {
      background-color: #444;
      border-bottom: 2px solid #45818e;
    }

    #tab-content {
      display: flex;
      flex-direction: column;
      height: calc(100vh - 130px);
      position: relative;
    }

    #map {
      flex: 1;
      width: 100%;
    }

    #filters {
      position: absolute;
      bottom: 20px;
      right: 20px;
      z-index: 1000;
      background: #333;
      padding: 10px;
      border-radius: 5px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      width: auto;
    }

    .filter-group {
      margin-bottom: 0;
      display: flex;
      align-items: center;
      color: white;
    }

    .filter-group label {
      margin-right: 5px;
      font-weight: bold;
      color: white;
      margin-bottom: 0;
      white-space: nowrap;
    }

    #filters select {
      padding: 5px;
      border-radius: 4px;
      border: 1px solid #ccc;
      background-color: white;
      color: black;
    }

    #apply-filters {
      padding: 5px 10px;
      background: #45818e;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      height: fit-content;
    }

    #apply-filters:hover {
      background: #80c2d1;
    }

    .popup-activity-link {
      display: block;
      margin-top: 8px;
      padding: 5px 10px;
      background: #45818e;
      color: white !important;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      text-align: center;
      text-decoration: none;
      transform: scale(0.9);
      transform-origin: center center;
    }

    .popup-activity-link:hover,
    .popup-activity-link:visited {
      color: white !important;
    }

    .popup-activity-link:hover {
      background: #80c2d1;
    }

    #search {
      padding: 5px;
      border-radius: 4px;
      border: 1px solid #ccc;
      width: 200px;
    }

    #search-results {
      margin-top: 35px;
      background: #333;
      border: 1px solid #ccc;
    }

    #search-results div {
      padding: 8px;
      cursor: pointer;
      color: white;
    }

    #search-results div:hover {
      background-color: #66666680;
    }

    #clear-search {
      color: #ccc;
      font-size: 16px;
      display: none;
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
    }

    #clear-search:hover {
      color: white;
    }

    /* Hide Leaflet zoom controls */
    .leaflet-control-zoom {
      display: none !important;
    }

    #filters-container.hidden {
      display: none;
    }
  </style>
</head>

    <h1>Skaði</h1>

    <button id="skadi-chat-toggle" type="button" aria-label="Ouvrir Skadi" aria-expanded="false">?</button>
    <section id="skadi-chat-panel" class="hidden" aria-hidden="true">
      <div id="skadi-chat-header">Skadi</div>
      <div id="skadi-chat-messages"></div>
      <form id="skadi-chat-form">

    <aside id="journal-panel" class="hidden" aria-hidden="true">
      <div id="journal-panel-header">

  <!-- JavaScript -->
  <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
  <script src="vendor/photoswipe/photoswipe.umd.min.js"></script>
  <script src="vendor/photoswipe/photoswipe-lightbox.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
