name: Adventure Live Dispatch

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Action to apply"
        required: true
        type: choice
        options:
          - start_trip
          - start_live_day
          - add_point
          - enrich_point
          - stop_live_day
          - stop_trip
      trip_id:
        description: "Trip id (YYYY-MM-DD_name)"
        required: true
        type: string
      trip_name:
        description: "Trip display name (used for start_trip)"
        required: false
        type: string
      lat:
        description: "Latitude (required for add_point)"
        required: false
        type: string
      lng:
        description: "Longitude (required for add_point)"
        required: false
        type: string
      lon:
        description: "Longitude alias for add_point (optional)"
        required: false
        type: string
      accuracy:
        description: "GPS accuracy in meters (optional for add_point)"
        required: false
        type: string
      ts:
        description: "ISO timestamp local timezone (optional for add_point)"
        required: false
        type: string
      point_id:
        description: "Point identifier (uses point ts for enrich_point)"
        required: false
        type: string
      note:
        description: "Note text (optional for enrich_point)"
        required: false
        default: ""
        type: string
      photo:
        description: "Base64 encoded JPEG (optional for enrich_point)"
        required: false
        default: ""
        type: string
      photo_uploaded:
        description: "Set true if photo was uploaded via Contents API (enrich_point)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write

concurrency:
  group: adventure-live-dispatch
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Apply adventure live action
        env:
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: |
          python scripts/adventure_live_dispatch.py \
            --action "${{ inputs.action }}" \
            --trip-id "${{ inputs.trip_id }}" \
            --trip-name "${{ inputs.trip_name }}" \
            --lat "${{ inputs.lat }}" \
            --lng "${{ inputs.lng }}" \
            --lon "${{ inputs.lon }}" \
            --accuracy "${{ inputs.accuracy }}" \
            --ts "${{ inputs.ts }}" \
            --point-id "${{ inputs.point_id }}" \
            --note "${{ inputs.note }}" \
            --photo "${{ inputs.photo }}" \
            --photo-uploaded "${{ inputs.photo_uploaded }}"

      - name: Commit and push live state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live/
          if git diff --staged --quiet; then
            echo "No live changes to commit."
            exit 0
          fi
          git commit -m "chore(live): ${{ inputs.action }} ${{ inputs.trip_id }}"
          git pull --rebase origin main
          git push origin HEAD:main
