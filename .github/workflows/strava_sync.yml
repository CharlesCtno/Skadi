name: Strava Sync (Manual)

on:
  workflow_dispatch:
    inputs:
      activity_name:
        description: Exact Strava activity name to sync
        required: true
        type: string
      destination:
        description: Target Google Sheet tab (Sommets Progrès vs Bikepacking)
        required: true
        type: choice
        options:
          - sommets
          - bikepacking

permissions:
  contents: write
  id-token: write

concurrency:
  group: strava-sync-manual
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Authenticate to Google Cloud (OIDC)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Strava sync by activity name
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
          GOOGLE_SHEETS_SPREADSHEET_ID: ${{ secrets.GOOGLE_SHEETS_SPREADSHEET_ID }}
          ACTIVITY_NAME: ${{ inputs.activity_name }}
          DESTINATION: ${{ inputs.destination }}
        run: |
          python scripts/strava_sync.py --activity-name "${ACTIVITY_NAME}" --destination "${DESTINATION}"

      - name: Convert only new GPX to GeoJSON
        run: |
          # Convert:
          # 1) GPX files added/modified in this run
          # 2) GPX files whose expected GeoJSON output is missing
          declare -A TO_CONVERT=()

          while IFS= read -r f; do
            case "$f" in
              *.gpx) TO_CONVERT["$f"]=1 ;;
            esac
          done < <(git diff --name-only --diff-filter=AM -- data/raw/ data/bike/raw/)

          for gpx in data/raw/*.gpx data/bike/raw/*.gpx; do
            [ -f "$gpx" ] || continue
            if [[ "$gpx" == data/bike/raw/* ]]; then
              expected="data/bike/processed/$(basename "${gpx%.gpx}").geojson"
            else
              expected="data/processed/$(basename "${gpx%.gpx}").geojson"
            fi
            if [ ! -f "$expected" ]; then
              TO_CONVERT["$gpx"]=1
            fi
          done

          GPX_FILES=("${!TO_CONVERT[@]}")
          if [ "${#GPX_FILES[@]}" -eq 0 ]; then
            echo "No GPX files need conversion."
            exit 0
          fi
          echo "Converting ${#GPX_FILES[@]} GPX file(s):"
          printf ' - %s\n' "${GPX_FILES[@]}"
          python scripts/convert_gpx.py "${GPX_FILES[@]}"

      - name: Commit and push GPX/state
        env:
          ACTIVITY_NAME: ${{ inputs.activity_name }}
          DESTINATION: ${{ inputs.destination }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw/ data/bike/raw/ data/processed/ data/bike/processed/ data/strava_last_sync.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "[strava-sync] Add GPX for activity ${ACTIVITY_NAME} (${DESTINATION})"
          # Another workflow/user may have pushed to main while this job was running.
          # Rebase onto latest origin/main, then push.
          git pull --rebase origin main
          git push origin HEAD:main
