name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  workflow_run:
    workflows: ["Adventure Live Dispatch"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build site with Mapbox + Notion tokens
        env:
          MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          mkdir -p _site
          rsync -av --delete \
            --exclude ".git/" \
            --exclude ".github/" \
            ./ _site/
          python - <<'PY'
          import os
          from pathlib import Path

          mapbox_token = os.environ.get("MAPBOX_TOKEN", "").strip()
          notion_token = os.environ.get("NOTION_TOKEN", "").strip()
          if not mapbox_token:
              raise SystemExit("Missing repository secret: MAPBOX_TOKEN")
          if not notion_token:
              raise SystemExit("Missing repository secret: NOTION_TOKEN")

          script_path = Path("_site/script.js")
          placeholder = "YOUR_MAPBOX_TOKEN_HERE"
          notion_placeholder = "YOUR_NOTION_TOKEN_HERE"
          content = script_path.read_text(encoding="utf-8")
          if placeholder not in content:
              raise SystemExit(f"Placeholder '{placeholder}' not found in _site/script.js")
          if notion_placeholder not in content:
              raise SystemExit(f"Placeholder '{notion_placeholder}' not found in _site/script.js")

          content = content.replace(placeholder, mapbox_token)
          content = content.replace(notion_placeholder, notion_token)
          script_path.write_text(content, encoding="utf-8")
          print("Injected MAPBOX_TOKEN and NOTION_TOKEN into build artifact.")
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
