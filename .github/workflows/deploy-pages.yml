name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  workflow_run:
    workflows: ["Adventure Live Dispatch"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build site with Mapbox token
        env:
          MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}
        run: |
          mkdir -p _site
          rsync -av --delete \
            --exclude ".git/" \
            --exclude ".github/" \
            ./ _site/
          python - <<'PY'
          import os
          from pathlib import Path

          mapbox_token = os.environ.get("MAPBOX_TOKEN", "").strip()
          if not mapbox_token:
              raise SystemExit("Missing repository secret: MAPBOX_TOKEN")

          script_path = Path("_site/script.js")
          placeholder = "YOUR_MAPBOX_TOKEN_HERE"
          content = script_path.read_text(encoding="utf-8")
          if placeholder not in content:
              raise SystemExit(f"Placeholder '{placeholder}' not found in _site/script.js")

          content = content.replace(placeholder, mapbox_token)
          script_path.write_text(content, encoding="utf-8")
          print("Injected MAPBOX_TOKEN into build artifact.")
          PY

      - name: Build static Notion cache
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          python scripts/build_notion_cache.py \
            --summits-csv-url "https://docs.google.com/spreadsheets/d/e/2PACX-1vRa2uc5r5sohJICr4Hb4TyQwlJxwtFCVk_NLqu_APJ6yF2FturE2YhbAhuaV_THn6AA0d9U_4BafJ9m/pub?gid=0&single=true&output=csv" \
            --bike-csv-url "https://docs.google.com/spreadsheets/d/e/2PACX-1vRa2uc5r5sohJICr4Hb4TyQwlJxwtFCVk_NLqu_APJ6yF2FturE2YhbAhuaV_THn6AA0d9U_4BafJ9m/pub?gid=2069199560&single=true&output=csv" \
            --notion-token "${NOTION_TOKEN}" \
            --output-dir "_site/notion/pages"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
